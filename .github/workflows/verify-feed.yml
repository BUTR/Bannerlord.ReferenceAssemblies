name: Verify Feed

# The registry records which builds the feed already carries, so the three-hourly Steam check and the
# generate run never have to ask NuGet. That record is written when a push succeeds; this job is what
# keeps it honest. It reads the feed and rewrites every published marker, so a push that half succeeded,
# a package deleted or unlisted, or a version corrected after publishing all show up as a change here.
#
# Nothing else depends on it: a drifted marker only means a build is built again or skipped once, and
# the next run of this job puts it right.

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

concurrency:
  group: verify-feed
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TOOL: src/Bannerlord.ReferenceAssemblies/bin/Release/net10.0/Bannerlord.ReferenceAssemblies

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # master is protected; the registry is pushed back as the butr-registry-bot app, which the branch
      # rules let through. Its token lives for an hour and can only write this repository's contents.
      - name: Registry bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{vars.REGISTRY_APP_ID}}
          private-key: ${{secrets.REGISTRY_APP_KEY}}

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{steps.bot.outputs.token}}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x

      - name: Build
        run: dotnet build src/Bannerlord.ReferenceAssemblies/Bannerlord.ReferenceAssemblies.csproj --configuration Release

      - name: Reconcile the game registry against NuGet
        run: $TOOL mark-published --app game --fromFeed

      - name: Reconcile the dedicated server registry against NuGet
        run: $TOOL mark-published --app server --fromFeed

      - name: Reconcile the Modding Kit registry against NuGet
        run: $TOOL mark-published --app moddingkit --fromFeed

      - name: Commit the registries
        run: |
          if [ -z "$(git status --porcelain builds)" ]; then
            echo "Registries already match the feed."
            exit 0
          fi
          echo "The feed and the registries disagreed; recording the feed:"
          git --no-pager diff --stat builds
          git config user.name "butr-registry-bot[bot]"
          git config user.email "328763592+butr-registry-bot[bot]@users.noreply.github.com"
          git add builds
          git commit -m "chore: reconcile published markers with NuGet"
          git pull --rebase
          git push
