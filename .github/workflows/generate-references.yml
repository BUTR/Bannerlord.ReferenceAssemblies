name: GenerateReferences

# Packs the builds that the registry knows about but the feed does not have yet, for the game, then the
# dedicated server, then the Modding Kit. The registry supplies the depot manifests, so this is not
# limited to whatever branches Steam happens to expose today. Downloads still require Steam to serve
# the recorded manifests.

# master is protected, so the registry is pushed back as the butr-registry-bot app, which the branch rules
# let through. A push made with a real token would start any workflow listening for it, so this one is
# started only on request: by Update Build Registry through `gh workflow run`, by hand, or by dispatch.

on:
  repository_dispatch:
    types: [game_version_update]
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to generate"
        type: choice
        options: [all, game, server, moddingkit]
        default: all
      pack:
        description: "all: reference and GUI packages, then GUI.v3.All. references: reference packages only. gui: only the GUI packages the feed lacks, then GUI.v3.All. bundle: only GUI.v3.All."
        type: choice
        options: [all, references, gui, bundle]
        default: all
      builds:
        description: "Build ids to generate, space separated. Empty takes whatever the feed is missing."
        required: false
        default: ""
      limit:
        description: "Most builds to generate per app"
        required: false
        default: "4"
      reconcile:
        description: "Read NuGet first and correct the registry's published markers"
        type: boolean
        default: false

# One Steam session at a time: a second login with the same account replaces the first.
concurrency:
  group: steam-account
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  STEAM_LOGIN: ${{secrets.STEAM_LOGIN}}
  STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
  TOOL: src/Bannerlord.ReferenceAssemblies/bin/Release/net10.0/Bannerlord.ReferenceAssemblies
  FINAL: src/Bannerlord.ReferenceAssemblies/bin/Release/net10.0/final
  FINAL_BUNDLE: src/Bannerlord.ReferenceAssemblies/bin/Release/net10.0/final-bundle

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # GUI-only and bundle-only runs are the game's alone: no other app has GUI packages.
        app: ${{ (github.event.inputs.pack == 'gui' || github.event.inputs.pack == 'bundle') && fromJSON('["game"]') || github.event.inputs.app == 'game' && fromJSON('["game"]') || github.event.inputs.app == 'server' && fromJSON('["server"]') || github.event.inputs.app == 'moddingkit' && fromJSON('["moddingkit"]') || fromJSON('["game", "server", "moddingkit"]') }}
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
    - name: Registry bot token
      id: bot
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{vars.REGISTRY_APP_ID}}
        private-key: ${{secrets.REGISTRY_APP_KEY}}

    - uses: actions/checkout@v5
      with:
        submodules: recursive
        token: ${{steps.bot.outputs.token}}

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x

    - name: Build
      run: dotnet build src/Bannerlord.ReferenceAssemblies/Bannerlord.ReferenceAssemblies.csproj --configuration Release

    # A dispatch without inputs, as Update Build Registry and repository_dispatch send, packs everything.
    - name: Generate ${{matrix.app}} ${{github.event.inputs.pack == 'gui' && 'GUI packages' || 'reference assemblies'}}
      if: github.event.inputs.pack != 'bundle'
      run: >-
        $TOOL generate --app ${{matrix.app}}
        --maxBuilds ${{github.event.inputs.limit || 4}}
        ${{github.event.inputs.reconcile == 'true' && '--checkFeed' || ''}}
        ${{github.event.inputs.pack == 'gui' && '--guiOnly' || github.event.inputs.pack != 'references' && '--gui' || ''}}
        ${{github.event.inputs.builds && format('--buildId {0}', github.event.inputs.builds) || ''}}

    - name: Check for packages
      id: packages
      run: echo "exists=$(ls $FINAL/*.nupkg >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Upload NuGet packages
      if: steps.packages.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{matrix.app}}
        path: ${{env.FINAL}}/*.nupkg

    - name: NuGet login (trusted publishing)
      if: steps.packages.outputs.exists == 'true'
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: Aragas

    - name: Push to NuGet
      if: steps.packages.outputs.exists == 'true'
      run: dotnet nuget push "$FINAL/*.nupkg" --skip-duplicate --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

    - name: Push to GPR
      if: steps.packages.outputs.exists == 'true'
      run: dotnet nuget push "$FINAL/*.nupkg" --skip-duplicate --api-key ${{ secrets.REPO_ACCESS_TOKEN }} --source https://nuget.pkg.github.com/BUTR/index.json

    # Only after the push, so nothing is recorded as published that never reached the feed.
    - name: Record what was published
      if: steps.packages.outputs.exists == 'true' && github.event.inputs.pack != 'gui'
      run: $TOOL mark-published --app ${{matrix.app}} --buildId $(cat $FINAL/generated-builds.txt)

    # The GUI packages have a marker of their own, fed only the builds whose GUI packages were all packed.
    - name: Record the GUI packages published
      if: steps.packages.outputs.exists == 'true' && hashFiles(format('{0}/generated-gui-builds.txt', env.FINAL)) != ''
      run: |
        ids=$(cat $FINAL/generated-gui-builds.txt)
        if [ -n "$ids" ]; then
          $TOOL mark-published --app ${{matrix.app}} --gui --buildId $ids
        fi

    - name: Commit the registry
      if: steps.packages.outputs.exists == 'true'
      run: |
        if [ -z "$(git status --porcelain builds)" ]; then
          echo "No registry changes."
          exit 0
        fi
        git config user.name "butr-registry-bot[bot]"
        git config user.email "328763592+butr-registry-bot[bot]@users.noreply.github.com"
        git add builds
        git commit -m "chore: record published ${{matrix.app}} ${{github.event.inputs.pack == 'gui' && 'GUI packages' || 'reference assemblies'}}"
        git pull --rebase
        git push

    # The game's current stable and beta versions, now that their packages are on the feed. BUTR/.github
    # sets the org variables from them, waits for NuGet to index, and tells the mod repositories. A GUI-only
    # run publishes no new game version, so it tells nobody anything.
    - name: Current game versions
      if: steps.packages.outputs.exists == 'true' && matrix.app == 'game' && github.event.inputs.pack != 'gui'
      id: versions
      run: $TOOL versions --app game

    - name: Tell BUTR/.github the current versions
      if: steps.versions.outputs.published == 'true'
      env:
        GH_TOKEN: ${{secrets.REPO_ACCESS_TOKEN}}
      run: >-
        jq -n --arg stable "${{steps.versions.outputs.stable}}" --arg beta "${{steps.versions.outputs.beta}}"
        '{event_type: "game_versions", client_payload: {stable: $stable, beta: $beta}}'
        | gh api repos/BUTR/.github/dispatches --input -

    # GUI.v3.All: the GUI packages of every release version in one package, rebuilt whole from the feed and the
    # registry, which mark-published has just brought up to date. Last, so that a failure here never keeps the
    # registry from being committed. Its version ends in this workflow's run number, so it is published from this
    # workflow only. It is pushed without --skip-duplicate: a re-run keeps its run number, and a version already on
    # the feed must fail the push rather than be dropped without a word. A re-run with nothing new stops earlier,
    # at bundle-gui's comparison with the feed.
    - name: Bundle the GUI packages
      if: matrix.app == 'game' && (github.event.inputs.pack == 'bundle' || hashFiles(format('{0}/generated-gui-builds.txt', env.FINAL)) != '')
      id: bundle
      run: |
        if [ "${{github.event.inputs.pack}}" != "bundle" ] && [ -z "$(cat $FINAL/generated-gui-builds.txt)" ]; then
          echo "No GUI packages were published in this run; nothing to bundle."
          exit 0
        fi
        $TOOL bundle-gui --app game --revision ${{github.run_number}}

    - name: Upload the GUI bundle
      if: steps.bundle.outputs.packed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-gui-bundle
        path: ${{env.FINAL_BUNDLE}}/*.nupkg

    - name: NuGet login for the GUI bundle (trusted publishing)
      if: steps.bundle.outputs.packed == 'true'
      uses: NuGet/login@v1
      id: nuget-login-bundle
      with:
        user: Aragas

    - name: Push the GUI bundle to NuGet
      if: steps.bundle.outputs.packed == 'true'
      run: dotnet nuget push "$FINAL_BUNDLE/*.nupkg" --api-key "${{ steps.nuget-login-bundle.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

    - name: Push the GUI bundle to GPR
      if: steps.bundle.outputs.packed == 'true'
      run: dotnet nuget push "$FINAL_BUNDLE/*.nupkg" --api-key ${{ secrets.REPO_ACCESS_TOKEN }} --source https://nuget.pkg.github.com/BUTR/index.json
